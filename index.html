<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Visão</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
        .painel { background-color: white; padding: 20px 30px; border-radius: 8px; margin-bottom: 30px; text-align: center; width: 100%; max-width: 700px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select { margin-top: 15px; padding: 10px 15px; font-size: 16px; width: 100%; max-width: 300px; }
        
        .cenario { position: relative; width: 100%; max-width: 700px; background-color: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .imagem-cenario { width: 100%; height: 300px; display: block; object-fit: cover; transition: filter 0.5s ease; background-color: #ccc; }
        .texto-cenario { padding: 30px; transition: filter 0.5s ease; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transition: background 0.5s ease; z-index: 10; }

        /* Lógica dos Filtros */
        .normal .overlay { background: transparent; }
        .normal .imagem-cenario, .normal .texto-cenario { filter: none; }
        
        .miopia .imagem-cenario, .miopia .texto-cenario { filter: blur(4px); }
        .catarata .imagem-cenario, .catarata .texto-cenario { filter: blur(2px) contrast(60%) brightness(120%) sepia(30%); }
        .glaucoma .overlay { background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.95) 75%); }
        .degeneracao-macular .overlay { background: radial-gradient(circle at center, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 10%, transparent 25%); }
    </style>
</head>
<body>

    <div class="painel">
        <h1>Simulador de Visão</h1>
        <select id="seletor-disturbio">
            <option value="normal">Visão Normal</option>
            <option value="miopia">Miopia</option>
            <option value="catarata">Catarata</option>
            <option value="glaucoma">Glaucoma</option>
            <option value="degeneracao-macular">Degeneração Macular</option>
        </select>
    </div>

    <div id="cenario" class="cenario normal">
        <div class="overlay"></div>
        <img src="imagem.png" alt="Cenário de teste" class="imagem-cenario">
        <div class="texto-cenario">
            <h2>Lendo o Mundo</h2>
            <p>Se as letras ficarem embaçadas ou a tela escurecer, o JavaScript está funcionando perfeitamente!</p>
        </div>
    </div>

    <script>
        const seletor = document.getElementById('seletor-disturbio');
        const cenario = document.getElementById('cenario');

        seletor.addEventListener('change', function(evento) {
            const disturbioEscolhido = evento.target.value;
            cenario.className = 'cenario'; // Reseta as classes
            cenario.classList.add(disturbioEscolhido); // Adiciona a nova classe
        });
    </script>

</body>
</html>
